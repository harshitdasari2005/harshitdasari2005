<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sai Harshit Dasari — AI and Software Development Engineer">
  <title>Sai Harshit Dasari — AI and Software Development Engineer</title>
  <defs>
    <clipPath id="card"><rect width="1200" height="320" rx="28"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .name { font-size: 68px; font-weight: 800; letter-spacing: -1.5px; }
      .role { font-size: 24px; font-weight: 500; }
      .chip { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
      .pill { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .term { font-size: 15px; }
      /* Motion is an extra: every element is fully visible when animation is off. */
      @media (prefers-reduced-motion: no-preference) {
        .float1 { animation: float1 14s ease-in-out infinite alternate; }
        .float2 { animation: float2 18s ease-in-out infinite alternate; }
        .float3 { animation: float1 22s ease-in-out infinite alternate-reverse; }
        .blink { animation: blink 1.1s steps(1) infinite; }
        .ping { animation: ping 2.4s ease-in-out infinite; }
        .l1 { animation: type 9s steps(1) infinite both; animation-delay: 0s; }
        .l2 { animation: type 9s steps(1) infinite both; animation-delay: 0.6s; }
        .l3 { animation: type 9s steps(1) infinite both; animation-delay: 1.5s; }
        .l4 { animation: type 9s steps(1) infinite both; animation-delay: 2.1s; }
        .l5 { animation: type 9s steps(1) infinite both; animation-delay: 3s; }
        .star1 { animation: shoot 6s ease-in infinite; animation-delay: 1s; }
        .star2 { animation: shoot 6s ease-in infinite; animation-delay: 3.8s; }
        .sweep { animation: sweep 7s ease-in-out infinite; }
        .name-glow { animation: nameglow 4s ease-in-out infinite; }
        .chips g { animation: bob 3s ease-in-out infinite; }
        .chips g:nth-child(2) { animation-delay: 0.3s; } .chips g:nth-child(3) { animation-delay: 0.6s; }
        .chips g:nth-child(4) { animation-delay: 0.9s; } .chips g:nth-child(5) { animation-delay: 1.2s; }
      }
      @keyframes type { 0% { opacity: 0; } 4% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes shoot { 0% { transform: translate(0, 0); opacity: 0; } 5% { opacity: 1; } 25% { transform: translate(-420px, 210px); opacity: 0; } 100% { transform: translate(-420px, 210px); opacity: 0; } }
      @keyframes sweep { 0% { transform: translateX(-400px); } 60%, 100% { transform: translateX(1600px); } }
      @keyframes nameglow { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.6; } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes float1 { from { transform: translate(0, 0); } to { transform: translate(80px, 30px); } }
      @keyframes float2 { from { transform: translate(0, 0); } to { transform: translate(-90px, -20px); } }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      @keyframes ping { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <!-- Base + aurora -->
    <rect width="1200" height="320" fill="#070b1a"/>
    <g filter="url(#blur)">
      <circle class="float1" cx="230" cy="60" r="170" fill="#2563eb" opacity="0.55"/>
      <circle class="float2" cx="880" cy="300" r="190" fill="#7c3aed" opacity="0.45"/>
      <circle class="float3" cx="1120" cy="40" r="140" fill="#06b6d4" opacity="0.45"/>
    </g>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <!-- Shooting stars (hidden unless animating) -->
    <g stroke-linecap="round">
      <line class="star1" x1="700" y1="-10" x2="760" y2="-40" stroke="#e0f2fe" stroke-width="2" opacity="0"/>
      <line class="star2" x1="1150" y1="-10" x2="1210" y2="-40" stroke="#c4b5fd" stroke-width="2" opacity="0"/>
    </g>

    <!-- Light sweep (parked off-canvas unless animating) -->
    <g class="sweep" transform="translate(-400 0)">
      <rect x="0" y="-40" width="140" height="400" fill="#ffffff" opacity="0.05" transform="skewX(-20)"/>
    </g>

    <!-- Neural network behind the terminal -->
    <g stroke="#67e8f9" stroke-opacity="0.22" stroke-width="1.2">
      <line x1="720" y1="40" x2="800" y2="90"/><line x1="800" y1="90" x2="760" y2="170"/>
      <line x1="1150" y1="250" x2="1100" y2="290"/><line x1="1150" y1="250" x2="1185" y2="190"/>
      <line x1="700" y1="280" x2="760" y2="170"/>
    </g>
    <g fill="#67e8f9" filter="url(#glow)">
      <circle cx="720" cy="40" r="3"/><circle cx="800" cy="90" r="3.5" class="ping"/>
      <circle cx="760" cy="170" r="3"/><circle cx="700" cy="280" r="2.5" class="ping"/>
      <circle cx="1150" cy="250" r="3" class="ping"/><circle cx="1185" cy="190" r="2.5"/>
    </g>

    <!-- Status pill -->
    <rect x="80" y="44" width="246" height="30" rx="15" fill="#0f172a" fill-opacity="0.75" stroke="#22d3ee" stroke-opacity="0.45"/>
    <circle cx="100" cy="59" r="5" fill="#34d399" class="ping"/>
    <text x="114" y="64" class="mono pill" fill="#a5f3fc">AI ENGINEER · HYDERABAD</text>

    <!-- Name + role -->
    <text x="78" y="148" class="sans name name-glow" fill="#22d3ee" opacity="0.3" filter="url(#glow)">Sai Harshit Dasari</text>
    <text x="78" y="148" class="sans name" fill="url(#nameFill)">Sai Harshit Dasari</text>
    <rect x="82" y="166" width="150" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="208" class="sans role" fill="#cbd5e1">AI &amp; Software Development Engineer</text>

    <!-- Tech chips -->
    <g class="mono chip chips">
      <g>
      <rect x="80" y="232" width="112" height="32" rx="16" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="136" y="253" text-anchor="middle" fill="#67e8f9">AGENTIC AI</text>
      </g>
      <g>
      <rect x="202" y="232" width="62" height="32" rx="16" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.55"/>
      <text x="233" y="253" text-anchor="middle" fill="#a5b4fc">LLMs</text>
      </g>
      <g>
      <rect x="274" y="232" width="56" height="32" rx="16" fill="#c084fc" fill-opacity="0.14" stroke="#c084fc" stroke-opacity="0.55"/>
      <text x="302" y="253" text-anchor="middle" fill="#d8b4fe">MCP</text>
      </g>
      <g>
      <rect x="340" y="232" width="56" height="32" rx="16" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="368" y="253" text-anchor="middle" fill="#fcd34d">AWS</text>
      </g>
      <g>
      <rect x="406" y="232" width="98" height="32" rx="16" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="455" y="253" text-anchor="middle" fill="#7dd3fc">AZURE AI</text>
      </g>
    </g>

    <!-- Glass terminal card -->
    <g>
      <rect x="770" y="56" width="360" height="212" rx="16" fill="#0b1224" fill-opacity="0.78" stroke="url(#border)" stroke-width="1.5"/>
      <rect x="770" y="56" width="360" height="38" rx="16" fill="#ffffff" fill-opacity="0.04"/>
      <circle cx="794" cy="75" r="6" fill="#f87171"/>
      <circle cx="814" cy="75" r="6" fill="#fbbf24"/>
      <circle cx="834" cy="75" r="6" fill="#34d399"/>
      <text x="950" y="80" text-anchor="middle" class="mono" font-size="12" fill="#64748b">~/harshit — zsh</text>

      <g class="mono term">
        <text class="l1" x="792" y="124"><tspan fill="#34d399">❯</tspan><tspan fill="#e2e8f0"> whoami</tspan></text>
        <text class="l2" x="792" y="148" fill="#67e8f9">sai-harshit-dasari</text>
        <text class="l3" x="792" y="182"><tspan fill="#34d399">❯</tspan><tspan fill="#e2e8f0"> cat focus.txt</tspan></text>
        <text class="l4" x="792" y="206" fill="#c4b5fd">agentic-ai · llms · mcp</text>
        <text class="l5" x="792" y="240"><tspan fill="#34d399">❯</tspan><tspan fill="#e2e8f0"> status </tspan><tspan fill="#fcd34d">shipping</tspan></text>
        <rect x="960" y="227" width="9" height="17" fill="#e2e8f0" class="blink l5"/>
      </g>
    </g>
  </g>
</svg>
