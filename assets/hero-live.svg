<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sai Harshit Dasari — AI and Software Development Engineer">
  <title>Sai Harshit Dasari — AI and Software Development Engineer</title>
  <!-- All motion uses SMIL (<animate>), which Safari, Chrome and Firefox play inside <img>.
       Every element's resting state is visible, so a renderer that shows no motion still gets the full banner. -->
  <defs>
    <clipPath id="card"><rect width="1200" height="320" rx="28"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
      <animate attributeName="x1" values="0;-1;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="starTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .name { font-size: 68px; font-weight: 800; letter-spacing: -1.5px; }
      .role { font-size: 24px; font-weight: 500; }
      .chip { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
      .pill { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .term { font-size: 15px; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <!-- Base + drifting aurora -->
    <rect width="1200" height="320" fill="#070b1a"/>
    <g filter="url(#blur)">
      <circle cx="230" cy="60" r="170" fill="#2563eb" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0 0;90 35;0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="880" cy="300" r="190" fill="#7c3aed" opacity="0.45">
        <animateTransform attributeName="transform" type="translate" values="0 0;-100 -25;0 0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="40" r="140" fill="#06b6d4" opacity="0.45">
        <animateTransform attributeName="transform" type="translate" values="0 0;-70 40;0 0" dur="22s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <!-- Shooting stars: invisible at rest, streak across while animating -->
    <g opacity="0">
      <line x1="0" y1="0" x2="70" y2="-35" stroke="url(#starTail)" stroke-width="2.2" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="760 -20;340 190;340 190" keyTimes="0;0.22;1" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04;0.22;1" dur="6s" begin="1s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <line x1="0" y1="0" x2="60" y2="-30" stroke="url(#starTail)" stroke-width="1.8" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="1180 -20;800 170;800 170" keyTimes="0;0.2;1" dur="7s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04;0.2;1" dur="7s" begin="3.5s" repeatCount="indefinite"/>
    </g>

    <!-- Light sweep: parked off-canvas at rest -->
    <g transform="translate(-400 0)">
      <rect x="0" y="-40" width="140" height="400" fill="#ffffff" opacity="0.05" transform="skewX(-20)"/>
      <animateTransform attributeName="transform" type="translate" values="-400 0;1600 0;1600 0" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- Neural network behind the terminal (halo circles instead of filters) -->
    <g stroke="#67e8f9" stroke-opacity="0.22" stroke-width="1.2">
      <line x1="720" y1="40" x2="800" y2="90"/><line x1="800" y1="90" x2="760" y2="170"/>
      <line x1="1150" y1="250" x2="1100" y2="290"/><line x1="1150" y1="250" x2="1185" y2="190"/>
      <line x1="700" y1="280" x2="760" y2="170"/>
    </g>
    <g fill="#67e8f9">
      <circle cx="800" cy="90" r="9" fill-opacity="0.18"><animate attributeName="r" values="6;12;6" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="250" r="8" fill-opacity="0.18"><animate attributeName="r" values="5;11;5" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="280" r="7" fill-opacity="0.18"><animate attributeName="r" values="4;10;4" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="40" r="3"/><circle cx="800" cy="90" r="3.5"/>
      <circle cx="760" cy="170" r="3"/><circle cx="700" cy="280" r="2.5"/>
      <circle cx="1150" cy="250" r="3"/><circle cx="1185" cy="190" r="2.5"/>
    </g>

    <!-- Status pill -->
    <rect x="80" y="44" width="246" height="30" rx="15" fill="#0f172a" fill-opacity="0.75" stroke="#22d3ee" stroke-opacity="0.45"/>
    <circle cx="100" cy="59" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="114" y="64" class="mono pill" fill="#a5f3fc">AI ENGINEER · HYDERABAD</text>

    <!-- Name + role -->
    <text x="78" y="148" class="sans name" fill="url(#nameFill)">Sai Harshit Dasari</text>
    <rect x="82" y="166" width="150" height="5" rx="2.5" fill="url(#accent)">
      <animate attributeName="width" values="150;230;150" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="208" class="sans role" fill="#cbd5e1">AI &amp; Software Development Engineer</text>

    <!-- Tech chips, bobbing in a wave -->
    <g class="mono chip">
      <g>
        <rect x="80" y="232" width="112" height="32" rx="16" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="136" y="253" text-anchor="middle" fill="#67e8f9">AGENTIC AI</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="0s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="202" y="232" width="62" height="32" rx="16" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.55"/>
        <text x="233" y="253" text-anchor="middle" fill="#a5b4fc">LLMs</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="0.3s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="274" y="232" width="56" height="32" rx="16" fill="#c084fc" fill-opacity="0.14" stroke="#c084fc" stroke-opacity="0.55"/>
        <text x="302" y="253" text-anchor="middle" fill="#d8b4fe">MCP</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="340" y="232" width="56" height="32" rx="16" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.5"/>
        <text x="368" y="253" text-anchor="middle" fill="#fcd34d">AWS</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="0.9s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="406" y="232" width="98" height="32" rx="16" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.5"/>
        <text x="455" y="253" text-anchor="middle" fill="#7dd3fc">AZURE AI</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Glass terminal card -->
    <rect x="770" y="56" width="360" height="212" rx="16" fill="#0b1224" fill-opacity="0.78" stroke="url(#border)" stroke-width="1.5"/>
    <rect x="770" y="56" width="360" height="38" rx="16" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="794" cy="75" r="6" fill="#f87171"/>
    <circle cx="814" cy="75" r="6" fill="#fbbf24"/>
    <circle cx="834" cy="75" r="6" fill="#34d399"/>
    <text x="950" y="80" text-anchor="middle" class="mono" font-size="12" fill="#64748b">~/harshit — zsh</text>

    <!-- Lines are shown, then cleared at 80% of the 9 s loop and typed back one by one -->
    <g class="mono term">
      <text x="792" y="124"><tspan fill="#34d399">❯</tspan><tspan fill="#e2e8f0"> whoami</tspan>
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.8;0.82" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
      <text x="792" y="148" fill="#67e8f9">sai-harshit-dasari
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.8;0.85" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
      <text x="792" y="182"><tspan fill="#34d399">❯</tspan><tspan fill="#e2e8f0"> cat focus.txt</tspan>
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.8;0.89" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
      <text x="792" y="206" fill="#c4b5fd">agentic-ai · llms · mcp
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.8;0.92" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
      <g>
        <text x="792" y="240"><tspan fill="#34d399">❯</tspan><tspan fill="#e2e8f0"> status </tspan><tspan fill="#fcd34d">shipping</tspan></text>
        <rect x="960" y="227" width="9" height="17" fill="#e2e8f0">
          <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
        </rect>
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.8;0.96" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
